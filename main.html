<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Курс HTML для початківців</title>
</head>
<body>

    <header>
        <h1>Курс HTML для початківців</h1>
        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="lessons.html">Уроки</a></li>
                <li><a href="contacts.html">Контакти</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Про курс</h2>
            <img src="students.jpg" alt="Студенти навчаються розробці вебсторінок за комп'ютерами">
            <p>На курсі ви навчитеся створювати вебсторінки.</p>
        </section>

        <section>
            <h2>Реєстрація</h2>
            <form method="post">
                <p>
                    <label for="username">Ім'я:</label><br>
                    <input type="text" id="username" name="username" required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <button type="submit">Зареєструватися</button>
            </form>
        </section>
    </main>

</body>
</html>

<!--
СПИСОК ВИПРАВЛЕНИХ ПРОБЛЕМ ДОСТУПНОСТІ:

1. Додано мову документа:
   У тег <html> додано атрибут lang="uk"

2. Виправлено структуру заголовків:
   Головний заголовок змінено з <h2> на <h1>. Заголовки розділів змінено з <h4> на <h2>

3. Покращено текст посилань у навігації:
   Блок з посиланнями загорнуто в тег <nav> з списком <ul>/<li>. Незрозумілі тексти посилань "Тут" та "Натиснути тут" замінено на зрозумілі "Уроки" та "Контакти"

4. Додано текстовий опис зображення:
   Тегу <img> додано атрибут alt з описом

5. Додано зв'язок між тегами <label> та полями вводу:
   Поля вводу отримали id, а текст підписів огортнуто в <label for="...">

6. Змінено тип поля для електронної пошти:
   Для поля Email змінено type="text" на type="email"

7. Організовано структуру сторінки:
   Використано структурні теги <header>, <main> та <section> замість звичайного <div>, що допомагає легко орієнтуватися по сторінці.
-->
