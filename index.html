<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товарів</title>
    <link rel="stylesheet" href="style-less.css">
</head>
<body>

    <header class="header">
        <h1>Наш каталог</h1>
    </header>

    <main class="catalog">
        <div class="card">
            <h2 class="card__title">Товар 1</h2>
            <p class="card__desc">Короткий опис першого чудового товару.</p>
            <span class="card__price">500 грн</span>
            <button class="btn">Купити</button>
        </div>

        <div class="card">
            <h2 class="card__title">Товар 2</h2>
            <p class="card__desc">Короткий опис другого чудового товару.</p>
            <span class="card__price">750 грн</span>
            <button class="btn">Купити</button>
        </div>

        <div class="card">
            <h2 class="card__title">Товар 3</h2>
            <p class="card__desc">Короткий опис третього чудового товару.</p>
            <span class="card__price">1000 грн</span>
            <button class="btn">Купити</button>
        </div>
    </main>

</body>
</html>
