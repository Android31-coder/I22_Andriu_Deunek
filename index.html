<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин техніки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>TechShop</h1>

        <nav class="header__menu">
            <a href="#">Головна</a>
            <a href="#">Товари</a>
            <a href="#">Контакти</a>
        </nav>
    </header>

    <main>
        <h2>Наші товари</h2>

        <div class="products">

            <div class="product-card card">
                <h3 class="product-card__title">Навушники</h3>
                <p>Якісні навушники для музики та ігор.</p>
                <p class="product-card__price">1200 грн</p>
                <button class="button">Купити</button>
            </div>

            <div class="product-card card">
                <h3 class="product-card__title">Мишка</h3>
                <p>Зручна комп'ютерна мишка для роботи.</p>
                <p class="product-card__price">650 грн</p>
                <button class="button">Купити</button>
            </div>

            <div class="product-card card">
                <h3 class="product-card__title">Клавіатура</h3>
                <p>Механічна клавіатура для геймерів.</p>
                <p class="product-card__price">1800 грн</p>
                <button class="button">Купити</button>
            </div>

            <div class="product-card card">
                <h3 class="product-card__title">Монітор</h3>
                <p>Монітор з хорошою якістю зображення.</p>
                <p class="product-card__price">5200 грн</p>
                <button class="button">Купити</button>
            </div>

        </div>
    </main>

    <footer>
        <p>TechShop 2026</p>
    </footer>

</body>
</html>
