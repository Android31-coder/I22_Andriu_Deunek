<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивний інтернет-магазин - ТехноМаркет</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-container">
            <h1 class="logo">ТехноМаркет</h1>
            <nav class="main-nav">
                <a href="#catalog">Каталог</a>
                <a href="#about">Про нас</a>
                <a href="#delivery">Доставка</a>
                <a href="#contacts">Контакти</a>
            </nav>
        </div>
    </header>
    <main class="container">
        <section id="catalog" class="catalog-section">
            <h2 class="section-title">Каталог товарів</h2>
            
            <div class="products-grid">
                <div class="product-card">
                    <img src="https://picsum.photos/300/200?random=1" alt="Смартфон">
                    <div class="product-info">
                        <h3 class="product-title">Смартфон Pro X</h3>
                        <p class="product-price">12 499 ₴</p>
                        <button class="buy-btn">Купити</button>
                    </div>
                </div>
                <div class="product-card">
                    <img src="https://picsum.photos/300/200?random=2" alt="Ноутбук">
                    <div class="product-info">
                        <h3 class="product-title">Ноутбук Ultra Slim</h3>
                        <p class="product-price">28 999 ₴</p>
                        <button class="buy-btn">Купити</button>
                    </div>
                </div>
                <div class="product-card">
                    <img src="https://picsum.photos/300/200?random=3" alt="Бездротові навушники">
                    <div class="product-info">
                        <h3 class="product-title">Навушники Bass Boost</h3>
                        <p class="product-price">2 299 ₴</p>
                        <button class="buy-btn">Купити</button>
                    </div>
                </div>
                <div class="product-card">
                    <img src="https://picsum.photos/300/200?random=4" alt="Смарт-годинник">
                    <div class="product-info">
                        <h3 class="product-title">Смарт-годинник Active</h3>
                        <p class="product-price">4 500 ₴</p>
                        <button class="buy-btn">Купити</button>
                    </div>
                </div>
                <div class="product-card">
                    <img src="https://picsum.photos/300/200?random=5" alt="Планшет">
                    <div class="product-info">
                        <h3 class="product-title">Планшет Tab 10.4</h3>
                        <p class="product-price">9 800 ₴</p>
                        <button class="buy-btn">Купити</button>
                    </div>
                </div>
                <div class="product-card">
                    <img src="https://picsum.photos/300/200?random=6" alt="Електрична зубна щітка">
                    <div class="product-info">
                        <h3 class="product-title">Електрощітка Clean Pro</h3>
                        <p class="product-price">1 499 ₴</p>
                        <button class="buy-btn">Купити</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 ТехноМаркет. Усі права захищені.</p>
        </div>
    </footer>

</body>
</html>
